<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ocean Workflow API</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #eef3f1;
    }

    .container {
      width: 90%;
      max-width: 720px;
      padding: 32px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin-top: 0;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 14px;
      box-sizing: border-box;
      border: 1px solid #bbb;
      border-radius: 10px;
      font-size: 16px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      background: #174f48;
      color: white;
    }

    pre {
      min-height: 100px;
      margin-top: 20px;
      padding: 16px;
      border-radius: 10px;
      background: #111;
      color: #7dffb2;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Ocean Workflow API</h1>

    <p>文章を入力すると、AIが業務データへ整理します。</p>

    <textarea
      id="text"
      placeholder="例：ロンドンの中小企業です。MSSPを探しています。"
    ></textarea>

    <button id="sendButton">AIで整理する</button>

    <pre id="result">ここに処理結果が表示されます。</pre>
  </main>

  <script>
    const sendButton = document.getElementById("sendButton");
    const textInput = document.getElementById("text");
    const resultArea = document.getElementById("result");

    sendButton.addEventListener("click", async () => {
      const text = textInput.value.trim();

      if (!text) {
        resultArea.textContent = "文章を入力してください。";
        return;
      }

      sendButton.disabled = true;
      sendButton.textContent = "処理中...";
      resultArea.textContent = "Ocean Workflow APIが解析しています...";

      try {
        const response = await fetch("/workflow", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ text })
        });

        const data = await response.json();

        resultArea.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        resultArea.textContent =
          "通信エラーが発生しました。\n" + error.message;
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = "AIで整理する";
      }
    });
  </script>
</body>
</html>
